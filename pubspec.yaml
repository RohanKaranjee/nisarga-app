name: nisarga_app
description: Cycle Care App

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  go_router: ^14.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.0
  fl_chart: ^0.69.0
  flutter_local_notifications: ^18.0.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  timezone: ^0.9.4
  flutter_svg: ^2.0.0
  url_launcher: ^6.3.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/doctors/
    - assets/images/articles/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FDEFF4" # Soft pink background to match the new image
  adaptive_icon_foreground: "assets/images/app_icon.png"

